name: Public-repo hygiene

# Backstop for .githooks/pre-commit — catches anything committed without
# that hook installed/enabled (git hooks are opt-in per clone; CI is not).
# See bin/check-file-allowlist.sh for the one allowlist both share.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      which:
        description: Which timed run to start (only used on manual dispatch)
        type: choice
        options:
          - miss-cost
          - server-down
        default: miss-cost

permissions:
  contents: read

jobs:
  allowlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: check every tracked file against the allowlist
        run: git ls-files | ./bin/check-file-allowlist.sh

      - name: self-test the allowlist (dot-prefixed paths are served, so they are held to a short list)
        run: bash bin/test-check-file-allowlist.sh

  # Timed runs for the "what does a cache miss cost" page. Manual dispatch only; never runs on push or
  # pull request. No secrets, no write permission, no third-party action beyond the pinned checkout above.
  # The script downloads the FosterStack Cache release and Gradle, and checks both against pinned sha256 values.
  bench-miss-cost:
    if: github.event_name == 'workflow_dispatch' && inputs.which == 'miss-cost'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: timed runs (cache off, cache on and empty, cache on and filled)
        run: BENCH_N=7 bash bin/bench-miss-cost.sh

  # Timed runs for the "what happens when the cache server is down" page. Same rules as above: manual dispatch only,
  # chosen with the "which" input (compared in this `if` only, never put into a shell command). The script checks its
  # downloads against pinned sha256 values. The blackhole address is a non-routable private address; nothing is sent
  # anywhere that answers. A build that hangs is cut off by the script's own per-build limit and the job timeout.
  bench-server-down:
    if: github.event_name == 'workflow_dispatch' && inputs.which == 'server-down'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: timed runs (no cache, cache on and empty, server refused, address that never answers)
        run: BENCH_N=7 BENCH_LIMIT=120 bash bin/bench-server-down.sh
